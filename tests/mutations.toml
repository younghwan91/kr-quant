# 오늘 붙인 회귀 검사가 **아직 무는지** 기계가 확인한다.
#
# ⚠️ 이 파일은 **커버리지 지표가 아니다.** 여기 적힌 변이가 전부 잡힌다는 것은
# "적어둔 버그는 잡힌다"는 뜻일 뿐이고, 적지 않은 버그에 대해서는 아무 말도 하지
# 않는다. **선언 안 한 버그는 이 하네스에게 존재하지 않는 버그다.**
# 항목 수가 늘어난다고 안전해지지 않는다 — 자기 구현을 그대로 베낀 동어반복 검사에
# 얕은 변이를 짝지어 놓으면 이 파일은 길어지면서 아무것도 지키지 않는다.
# 새 검사를 쓸 때 물어야 할 것은 "변이를 선언했나"가 아니라 **"이 검사가 없으면
# 어떤 버그가 조용히 지나가나"**이고, 그 버그가 여기 적힐 변이다.
#
# 그리고 **못 잡는 검사와 못 재현한 변이는 다르다.** 초록이 나오면 검사를 의심하기
# 전에 변이가 그 버그를 실제로 만들어내는지부터 확인하라 — 한 버그가 두 군데를
# 함께 바꿔야 재현되는 경우가 있고(아래 resize-closes-help), 리팩터가 그 버그를
# 아예 표현 불가능하게 만든 경우도 있다(그때는 안 잡히는 게 정상이다).
#
# scripts/verify_merge.py 가 이 파일을 읽어 각 변이를 소스에 실제로 주입하고,
# 선언된 검사가 정말 빨개지는지 본다. 통과만 보는 검사는 그 검사가 죽어도 초록이다
# (GUARDRAILS §5 각주 — "CI 가 초록이다"와 "규칙이 살아 있다"는 다르다).
#
# 워크트리는 자기가 **새로 추가한 검사**에 대해 여기에 항목을 더한다. 변이를 하나도
# 선언하지 않은 새 검사는 하네스가 경고로 띄운다.
#
# 앵커(find)가 사라지면 그 변이는 돌지 않고 경고로 뜬다 — 리팩터인지 검사 제거인지는
# 사람이 코드를 봐야 갈린다.

