[[mutation]]
id = "resize-closes-help"
why = "KEY_RESIZE 를 '아무 키' 로 먹으면 창 크기를 바꿀 때 도움말이 소리 없이 닫힌다"
guards = ["tests/test_tui_smoke.py::test_resize_does_not_silently_close_the_help_screen"]
# 두 군데를 함께 바꿔야 원래 버그가 재현된다 — KEY_RESIZE 가드만 빼면 도움말
# 분기의 **명시 키 목록**이 막아주고, 목록만 else 로 바꾸면 가드가 막는다.
# 한 곳만 바꾸면 "검사가 못 잡는다" 는 거짓 판정이 난다.
[[mutation.edits]]
file = "src/kr_quant/tui/flow_app.py"
find = """    if k == curses.KEY_RESIZE:
        return True"""
replace = ""
