[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kr-quant"
version = "0.1.0"
description = "키움 수급·시세 데이터 수집 및 퀀트 분석 (kiwoom-client 기반)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["kiwoom", "키움", "quant", "퀀트", "supply-demand", "수급", "kospi", "kosdaq"]
authors = [{ name = "Younghwan Chae", email = "chyohw97@gmail.com" }]
dependencies = [
    # auth 로그인 수정이 포함된 0.1.14 이상 필요. 미배포 시 README 의 개발 설정 참고.
    "kiwoom-client>=0.1.14",
    "pandas>=2.0",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.8"]
pg = ["psycopg2-binary>=2.9"]
dev = ["pytest>=8.0", "ruff>=0.6", "matplotlib>=3.8"]

[project.scripts]
kq-collect = "kr_quant.collectors.supply_demand:main"
kq-collect-daily = "kr_quant.collectors.daily_bars:main"
kq-collect-both = "kr_quant.collectors.combined:main"
kq-collect-sc = "kr_quant.collectors.short_credit:main"
kq-collect-sector = "kr_quant.collectors.sector_index:main"
kq-collect-shares = "kr_quant.collectors.listed_shares:main"
kq-collect-krx-shares = "kr_quant.collectors.krx_shares:main"
kq-collect-earnings = "kr_quant.collectors.dart_earnings:main"
kq-collect-consensus = "kr_quant.collectors.naver_consensus:main"
kq-screen = "kr_quant.strategies.accumulation:main"
kq-backtest = "kr_quant.strategies.backtest:main"
kq-pead = "kr_quant.strategies.pead:main"
kq-supply-wave = "kr_quant.strategies.supply_wave:main"
kq-graph-flow = "kr_quant.models.graph_flow:main"
kq-multi-signal = "kr_quant.strategies.multi_signal:main"
kq-ensemble-signal = "kr_quant.models.ensemble_signal:main"
kq-chart = "kr_quant.viz.supply_demand_chart:main"

[project.urls]
Repository = "https://github.com/younghwan91/kr-quant"

[tool.hatch.build.targets.wheel]
packages = ["src/kr_quant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
