[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kr-quant"
version = "0.1.0"
description = "코스피·코스닥 알파 리서치 라이브러리 — 개별 트레이드 분포·walk-forward·음성대조를 강제하는 검증 가드레일과 정직한 부정 결과 (데이터 수집은 kr-quant-airflow)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = [
    "quant", "퀀트", "alpha-research", "backtesting", "walk-forward",
    "overfitting", "pead", "supply-demand", "수급", "kospi", "kosdaq", "kiwoom", "키움",
]
authors = [{ name = "Younghwan Chae", email = "chyohw97@gmail.com" }]
dependencies = [
    "pandas>=2.0",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.8"]
pg = ["psycopg2-binary>=2.9"]
dev = ["pytest>=8.0", "ruff>=0.6", "matplotlib>=3.8"]

[project.scripts]
# 데이터 수집 CLI(kq-collect*)는 collectors/와 함께 kr-quant-airflow로 이전됨.
kq-screen = "kr_quant.strategies.accumulation:main"
kq-backtest = "kr_quant.strategies.backtest:main"
kq-pead = "kr_quant.strategies.pead:main"
kq-sepa = "kr_quant.strategies.sepa_experiment:main"
kq-supply-wave = "kr_quant.strategies.supply_wave:main"
kq-graph-flow = "kr_quant.models.graph_flow:main"
kq-multi-signal = "kr_quant.strategies.multi_signal:main"
kq-ensemble-signal = "kr_quant.models.ensemble_signal:main"
kq-chart = "kr_quant.viz.supply_demand_chart:main"

[project.urls]
Repository = "https://github.com/younghwan91/kr-quant"

[tool.hatch.build.targets.wheel]
packages = ["src/kr_quant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# repo 루트를 sys.path에 추가 → bare `pytest`도 research/ 모듈을 찾음(CI가 `python -m pytest`
# 없이도 통과). numba/optuna는 옵셔널이라 미설치 환경에선 해당 테스트가 importorskip으로 스킵됨.
pythonpath = ["."]
